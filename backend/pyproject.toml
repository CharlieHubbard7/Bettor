[tool.poetry]
name = "bettor-backend"
version = "0.1.0"
description = "Bettor — systematic sports betting edge-finding system (backend)"
authors = ["Charlie Hubbard <charliehubbardjr@gmail.com>"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.111"
uvicorn = { extras = ["standard"], version = "^0.30" }
sqlalchemy = { extras = ["asyncio"], version = "^2.0" }
alembic = "^1.13"
asyncpg = "^0.29"
aiosqlite = "^0.20"
httpx = "^0.27"
pydantic = "^2.7"
pydantic-settings = "^2.2"
loguru = "^0.7"
apscheduler = "^3.10"
pandas = "^2.2"
polars = "^0.20"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
pytest-asyncio = "^0.23"
pytest-cov = "^5.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
